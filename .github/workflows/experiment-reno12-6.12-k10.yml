name: Experiment Reno12 6.12 on K10 MT6895

on:
  workflow_dispatch:
    inputs:
      build_gki:
        description: "Experiment A: build Reno12 6.12 GKI Image"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      build_modules:
        description: "Experiment B: build/probe MT6895 6.12 device modules"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      clone_k10_reference:
        description: "Clone K10 5.10 source and analyze DTS references"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      strict_fail:
        description: "Fail workflow if GKI/modules build fails"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      upload_full_dist:
        description: "Upload full dist archive"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  experiment:
    name: Reno12 6.12 K10 experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      RENO12_COMMON_REPO: https://github.com/oppo-source/android_kernel_oppo_mt6896.git
      RENO12_MODULES_REPO: https://github.com/oppo-source/android_kernel_modules_oppo_mt6896.git
      RENO12_BRANCH: oppo/mt6896_b_16.0_reno12

      K10_COMMON_REPO: https://github.com/oppo-source/android_kernel_oppo_mt6895.git
      K10_MODULES_REPO: https://github.com/oppo-source/android_kernel_modules_oppo_mt6895.git
      K10_BRANCH: oppo/mt6895_t_13.0.0_k10_5g

      WORKROOT: ${{ github.workspace }}/kernel_platform
      K10ROOT: ${{ github.workspace }}/k10_reference
      DIST: ${{ github.workspace }}/kernel_platform/dist

      BAZEL_FLAGS: "--jobs=6 --keep_going --verbose_failures"

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            jq \
            kmod \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            zstd \
            dwarves

      - name: Clone Reno12 6.12 sources
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${WORKROOT}"

          git clone --depth=1 --branch "${RENO12_BRANCH}" \
            "${RENO12_MODULES_REPO}" \
            "${WORKROOT}"

          git clone --depth=1 --branch "${RENO12_BRANCH}" \
            "${RENO12_COMMON_REPO}" \
            "${WORKROOT}/kernel-6.12"

          cd "${WORKROOT}"

          mkdir -p "${DIST}/logs"

          echo "==== WORKROOT ====" | tee "${DIST}/logs/source-tree.txt"
          ls -la | tee -a "${DIST}/logs/source-tree.txt"

          echo "==== kernel dir ====" | tee -a "${DIST}/logs/source-tree.txt"
          ls -la kernel | tee -a "${DIST}/logs/source-tree.txt"

          echo "==== kernel-6.12 ====" | tee -a "${DIST}/logs/source-tree.txt"
          ls -la kernel-6.12 | head -120 | tee -a "${DIST}/logs/source-tree.txt"

          chmod +x kernel/tools/bazel || true
          chmod +x kernel/build/kernel/kleaf/bazel.sh || true

      - name: Clone K10 5.10 reference sources
        if: ${{ github.event.inputs.clone_k10_reference == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          mkdir -p "${K10ROOT}"

          git clone --depth=1 --branch "${K10_BRANCH}" \
            "${K10_COMMON_REPO}" \
            "${K10ROOT}/kernel-5.10-k10"

          git clone --depth=1 --branch "${K10_BRANCH}" \
            "${K10_MODULES_REPO}" \
            "${K10ROOT}/modules-5.10-k10"

          mkdir -p "${DIST}/logs"

          {
            echo "==== K10 kernel Makefile ===="
            grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" "${K10ROOT}/kernel-5.10-k10/Makefile" || true

            echo
            echo "==== K10 DTS MT6895 files ===="
            find "${K10ROOT}/kernel-5.10-k10/arch/arm64/boot/dts/mediatek" \
              -maxdepth 3 \
              -type f \
              \( -iname "*6895*" -o -iname "*k6895*" -o -iname "*lisa*" -o -iname "*21641*" \) \
              | sort || true

            echo
            echo "==== K10 modules tree ===="
            find "${K10ROOT}/modules-5.10-k10" -maxdepth 3 -type d | sort | head -300 || true
          } | tee "${DIST}/logs/k10-reference-layout.txt"

      - name: Sanity check Reno12 6.12 layout
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== Reno12 common kernel Makefile ===="
            grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" ../kernel-6.12/Makefile || true

            echo
            echo "==== kernel_device_modules-6.12 ===="
            ls -la kernel_device_modules-6.12 || true

            echo
            echo "==== mt6895 platform marker ===="
            ls -la kernel_device_modules-6.12/mt6895 || true
            cat kernel_device_modules-6.12/mt6895/mgk.enabled || true

            echo
            echo "==== MT6895/K6895/Lisa references in Reno12 6.12 ===="
            find kernel_device_modules-6.12 ../vendor/mediatek/kernel_modules ../vendor/oplus \
              -type f \
              \( -name "*.c" -o -name "*.h" -o -name "*.dts" -o -name "*.dtsi" -o -name "BUILD.bazel" -o -name "Kbuild" -o -name "Makefile" -o -name "*.mk" \) \
              -print0 \
              | xargs -0 grep -In "mt6895\|k6895\|lisa\|21641\|PGJM10" \
              2>/dev/null | head -1500 || true

            echo
            echo "==== vendor mediatek kernel modules ===="
            find ../vendor/mediatek/kernel_modules -maxdepth 3 -type d | sort || true

            echo
            echo "==== vendor oplus modules ===="
            find ../vendor/oplus -maxdepth 3 -type d | sort || true
          } | tee "${DIST}/logs/reno12-6.12-layout-and-mt6895-probe.txt"

      - name: Check MT6895 pinctrl clock power-domain support
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== MT6895 pinctrl files ===="
            find kernel_device_modules-6.12 ../kernel-6.12 \
              -type f \
              \( -name "*pinctrl*mt6895*" -o -name "*mt6895*pinctrl*" -o -name "pinctrl-mtk-mt6895.h" \) \
              2>/dev/null | sort || true

            echo
            echo "==== MT6895 clock files ===="
            find kernel_device_modules-6.12 ../kernel-6.12 \
              -type f \
              \( -name "*clk*mt6895*" -o -name "*mt6895*clk*" -o -name "*fmeter*mt6895*" \) \
              2>/dev/null | sort || true

            echo
            echo "==== MT6895 power-domain / scpsys / dvfsrc files ===="
            find kernel_device_modules-6.12 ../kernel-6.12 \
              -type f \
              \( -name "*mt6895*power*" -o -name "*mt6895*scpsys*" -o -name "*dvfsrc*" -o -name "*spm*" \) \
              2>/dev/null | sort || true

            echo
            echo "==== MT6895 compatible strings in pinctrl/clk/power ===="
            grep -RIn \
              "mediatek,mt6895\|mt6895" \
              kernel_device_modules-6.12/drivers/pinctrl \
              kernel_device_modules-6.12/drivers/clk \
              kernel_device_modules-6.12/drivers/soc \
              kernel_device_modules-6.12/drivers/misc/mediatek \
              ../kernel-6.12/drivers/pinctrl \
              ../kernel-6.12/drivers/clk \
              ../kernel-6.12/drivers/soc \
              2>/dev/null | head -1200 || true

            echo
            echo "==== MT6895 DT bindings ===="
            find kernel_device_modules-6.12 ../kernel-6.12 \
              -type f \
              \( -path "*dt-bindings*clock*" -o -path "*dt-bindings*power*" -o -path "*dt-bindings*pinctrl*" -o -path "*dt-bindings*reset*" \) \
              2>/dev/null \
              | grep -Ei "mt6895|mtk|mediatek" \
              | sort || true
          } | tee "${DIST}/logs/check-mt6895-pinctrl-clock-powerdomain.txt"

      - name: Check MT6895 PMIC regulator charger Type-C support
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== 6.12 regulator drivers ===="
            find kernel_device_modules-6.12/drivers/regulator ../kernel-6.12/drivers/regulator \
              -type f \
              2>/dev/null \
              | grep -Ei "mt6359|mt6363|mt6366|mt6368|mt6369|mt6373|mt6375|mt6379|mt6380|dvfsrc|fan53870|wl2868|rt4803|rt6160|oplus" \
              | sort || true

            echo
            echo "==== 6.12 MFD PMIC drivers ===="
            find kernel_device_modules-6.12/drivers/mfd ../kernel-6.12/drivers/mfd \
              -type f \
              2>/dev/null \
              | grep -Ei "mt635|mt636|mt637|spmi|pmic|oplus" \
              | sort || true

            echo
            echo "==== 6.12 power supply drivers ===="
            find kernel_device_modules-6.12/drivers/power ../kernel-6.12/drivers/power \
              -type f \
              2>/dev/null \
              | grep -Ei "mt6359|mt6375|gauge|charger|battery|pd|pe|ufcs|typec|oplus|vooc|svooc" \
              | sort || true

            echo
            echo "==== 6.12 Type-C / USB / PD drivers ===="
            find kernel_device_modules-6.12/drivers ../kernel-6.12/drivers \
              -type f \
              2>/dev/null \
              | grep -Ei "typec|tcpc|pd|usb.*mt|mt.*usb|ps5170|mt6375" \
              | sort | head -1000 || true

            echo
            echo "==== PMIC/regulator/charger compatible strings in Reno12 6.12 ===="
            grep -RIn \
              "mt6359p\|mt6363\|mt6366\|mt6368\|mt6369\|mt6373\|mt6375\|mt6380\|fan53870\|wl2868\|regulator\|gauge\|charger\|pdc\|typec\|ps5170" \
              kernel_device_modules-6.12 \
              ../vendor/oplus \
              ../vendor/mediatek/kernel_modules \
              2>/dev/null | head -1500 || true
          } | tee "${DIST}/logs/check-mt6895-pmic-regulator-charger-typec.txt"

      - name: Analyze K10 DTS references
        if: ${{ github.event.inputs.clone_k10_reference == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          mkdir -p "${DIST}/logs" "${DIST}/k10-analysis"

          K10_DTS_DIR="${K10ROOT}/kernel-5.10-k10/arch/arm64/boot/dts/mediatek"
          RENO12_SEARCH_ROOTS="${WORKROOT}/kernel/kernel_device_modules-6.12 ${WORKROOT}/kernel-6.12 ${WORKROOT}/vendor/mediatek/kernel_modules ${WORKROOT}/vendor/oplus"

          {
            echo "==== K10 k6895v1_64.dts includes ===="
            grep -RIn "#include" "${K10_DTS_DIR}/k6895v1_64.dts" || true

            echo
            echo "==== K10 key board nodes ===="
            grep -RIn \
              "compatible\|pinctrl-\|pinctrl-names\|clocks\|clock-names\|power-domains\|regulator\|gpio\|panel\|touch\|charger\|gauge\|battery\|typec\|pdc\|ps5170\|connfem\|gps\|nfc\|camera\|imgsensor\|speaker\|amp" \
              "${K10_DTS_DIR}/k6895v1_64.dts" \
              "${K10_DTS_DIR}"/cust_mt6895*.dtsi \
              "${K10_DTS_DIR}"/nfc/*6895* \
              2>/dev/null | head -2000 || true

            echo
            echo "==== K10 PMIC / regulator / charger refs ===="
            grep -RIn \
              "mt6359p\|mt6363\|mt6366\|mt6368\|mt6369\|mt6373\|mt6375\|mt6380\|fan53870\|wl2868\|regulator\|gauge\|charger\|battery\|typec\|pdc\|ps5170" \
              "${K10_DTS_DIR}" \
              2>/dev/null | head -2000 || true

            echo
            echo "==== K10 pinctrl / clock / power-domain refs ===="
            grep -RIn \
              "pinctrl\|eint\|interrupts\|clocks\|clock-names\|power-domains\|scpsys\|dvfsrc\|mmsys\|smi\|iommu" \
              "${K10_DTS_DIR}" \
              2>/dev/null | head -2000 || true
          } | tee "${DIST}/logs/k10-dts-board-analysis.txt"

          # 提取 K10 DTS compatible 字符串
          grep -Rho 'compatible[[:space:]]*=[^;]*;' "${K10_DTS_DIR}" \
            2>/dev/null \
            | sed -E 's/.*compatible[[:space:]]*=[[:space:]]*//; s/;//' \
            | tr ',' '\n' \
            | sed -E 's/[<>]//g; s/"//g; s/^[[:space:]]+//; s/[[:space:]]+$//' \
            | grep -v '^$' \
            | sort -u \
            > "${DIST}/k10-analysis/k10-compatible-list.txt" || true

          echo "==== K10 compatible count ===="
          wc -l "${DIST}/k10-analysis/k10-compatible-list.txt" | tee "${DIST}/logs/k10-compatible-count.txt" || true

          # 检查 compatible 在 Reno12 6.12 驱动/模块源码中是否出现
          : > "${DIST}/k10-analysis/k10-compatible-found-in-reno12-6.12.txt"
          : > "${DIST}/k10-analysis/k10-compatible-missing-in-reno12-6.12.txt"

          while read -r comp; do
            [ -n "${comp}" ] || continue

            if grep -RIFq "${comp}" ${RENO12_SEARCH_ROOTS} 2>/dev/null; then
              echo "FOUND ${comp}" >> "${DIST}/k10-analysis/k10-compatible-found-in-reno12-6.12.txt"
            else
              echo "MISS ${comp}" >> "${DIST}/k10-analysis/k10-compatible-missing-in-reno12-6.12.txt"
            fi
          done < "${DIST}/k10-analysis/k10-compatible-list.txt"

          {
            echo "==== FOUND compatible in Reno12 6.12 ===="
            cat "${DIST}/k10-analysis/k10-compatible-found-in-reno12-6.12.txt" || true

            echo
            echo "==== MISSING compatible in Reno12 6.12 ===="
            cat "${DIST}/k10-analysis/k10-compatible-missing-in-reno12-6.12.txt" || true
          } | tee "${DIST}/logs/k10-compatible-coverage-report.txt"

      - name: Query Bazel targets
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          ./tools/bazel query '//kernel-6.12:*' \
            | sort \
            | tee "${DIST}/logs/query-kernel-6.12-targets.txt" || true

          ./tools/bazel query '//kernel_device_modules-6.12:*' \
            | sort \
            | tee "${DIST}/logs/query-kernel-device-modules-6.12-targets.txt" || true

          ./tools/bazel query '//...' \
            | grep -Ei 'mgk|k612|mtk|device|module|dtb|dtbo|dist|mt6895|k6895|gki|aarch64' \
            | sort \
            | tee "${DIST}/logs/query-interesting-targets.txt" || true

      - name: Experiment A - build Reno12 6.12 GKI Image
        if: ${{ github.event.inputs.build_gki == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/gki" "${DIST}/logs"

          GKI_BUILT=0

          CANDIDATES=(
            "//kernel-6.12:kernel_aarch64_dist"
            "//kernel-6.12:gki_aarch64_dist"
            "//kernel-6.12:kernel_aarch64"
          )

          for target in "${CANDIDATES[@]}"; do
            echo "Trying GKI target: ${target}"

            if ./tools/bazel query "${target}" >/dev/null 2>&1; then
              if [[ "${target}" == *_dist ]]; then
                if ./tools/bazel run ${BAZEL_FLAGS} \
                  "${target}" \
                  -- --destdir="${DIST}/gki" \
                  2>&1 | tee "${DIST}/logs/experiment-a-gki-$(basename "${target}").log"; then
                  GKI_BUILT=1
                  break
                fi
              else
                if ./tools/bazel build ${BAZEL_FLAGS} \
                  "${target}" \
                  2>&1 | tee "${DIST}/logs/experiment-a-gki-$(basename "${target}").log"; then
                  GKI_BUILT=1

                  BAZEL_BIN="$(./tools/bazel info bazel-bin)"
                  find "${BAZEL_BIN}" -type f \( \
                    -name "Image" -o \
                    -name "Image.gz" -o \
                    -name "Image.lz4" -o \
                    -name "vmlinux" -o \
                    -name "System.map" \
                  \) -print | sort | tee "${DIST}/logs/experiment-a-gki-bazel-output-files.txt" || true

                  while read -r f; do
                    [ -f "$f" ] || continue
                    cp -av "$f" "${DIST}/gki/" || true
                  done < "${DIST}/logs/experiment-a-gki-bazel-output-files.txt"

                  break
                fi
              fi
            else
              echo "Missing GKI target: ${target}"
            fi
          done

          echo "GKI_BUILT=${GKI_BUILT}" | tee "${DIST}/logs/experiment-a-gki-result.txt"

          find "${DIST}/gki" -maxdepth 5 -type f \
            | sort \
            | tee "${DIST}/logs/experiment-a-gki-files.txt" || true

          if [ "${GKI_BUILT}" != "1" ] && [ "${{ github.event.inputs.strict_fail }}" = "true" ]; then
            exit 1
          fi

      - name: Experiment B - build MT6895 / MGK device modules by Bazel
        if: ${{ github.event.inputs.build_modules == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/modules-bazel" "${DIST}/logs"

          QUERY_FILE="${DIST}/logs/query-kernel-device-modules-6.12-targets.txt"

          if [ ! -s "${QUERY_FILE}" ]; then
            ./tools/bazel query '//kernel_device_modules-6.12:*' \
              | sort \
              | tee "${QUERY_FILE}" || true
          fi

          {
            echo "==== Candidate module targets ===="
            grep -Ei 'mgk_64_k612|mgk|k612|dist|module|dtb|dtbo' "${QUERY_FILE}" | sort || true
          } | tee "${DIST}/logs/experiment-b-candidate-module-targets.txt"

          MODULES_BUILT=0

          CANDIDATES=(
            "//kernel_device_modules-6.12:mgk_64_k612_dist"
            "//kernel_device_modules-6.12:mgk_64_k612"
            "//kernel_device_modules-6.12:kernel_device_modules_dist"
            "//kernel_device_modules-6.12:kernel_device_modules"
          )

          for target in "${CANDIDATES[@]}"; do
            echo "Trying module target: ${target}"

            if grep -qx "${target}" "${QUERY_FILE}"; then
              if [[ "${target}" == *_dist ]]; then
                if ./tools/bazel run ${BAZEL_FLAGS} \
                  "${target}" \
                  -- --destdir="${DIST}/modules-bazel" \
                  2>&1 | tee "${DIST}/logs/experiment-b-modules-$(basename "${target}").log"; then
                  MODULES_BUILT=1
                  break
                fi
              else
                if ./tools/bazel build ${BAZEL_FLAGS} \
                  "${target}" \
                  2>&1 | tee "${DIST}/logs/experiment-b-modules-$(basename "${target}").log"; then
                  MODULES_BUILT=1

                  BAZEL_BIN="$(./tools/bazel info bazel-bin)"
                  echo "bazel-bin=${BAZEL_BIN}" | tee "${DIST}/logs/experiment-b-bazel-bin.txt"

                  find "${BAZEL_BIN}" -type f \( \
                    -name "*.ko" -o \
                    -name "*.dtb" -o \
                    -name "*.dtbo" -o \
                    -name "modules.order" -o \
                    -name "Module.symvers" \
                  \) -print | sort | tee "${DIST}/logs/experiment-b-bazel-output-files.txt" || true

                  while read -r f; do
                    [ -f "$f" ] || continue
                    cp -av "$f" "${DIST}/modules-bazel/" || true
                  done < "${DIST}/logs/experiment-b-bazel-output-files.txt"

                  break
                fi
              fi
            else
              echo "Missing module target: ${target}"
            fi
          done

          echo "MODULES_BUILT=${MODULES_BUILT}" | tee "${DIST}/logs/experiment-b-modules-result.txt"

          find "${DIST}/modules-bazel" -maxdepth 6 -type f \
            | sort \
            | tee "${DIST}/logs/experiment-b-modules-files.txt" || true

          if [ "${MODULES_BUILT}" != "1" ] && [ "${{ github.event.inputs.strict_fail }}" = "true" ]; then
            exit 1
          fi

      - name: Experiment B fallback - build.config.mtk_kernel_device_modules
        if: ${{ github.event.inputs.build_modules == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/modules-buildconfig" "${DIST}/logs"

          CONFIG="kernel_device_modules-6.12/build.config.mtk_kernel_device_modules"

          if [ ! -f "${CONFIG}" ]; then
            echo "Missing ${CONFIG}"
            exit 1
          fi

          cat "${CONFIG}" | tee "${DIST}/logs/experiment-b-build-config-file.txt"

          export BUILD_CONFIG="${CONFIG}"
          export DIST_DIR="${DIST}/modules-buildconfig"
          export OUT_DIR="${WORKROOT}/out/modules-buildconfig"
          export SKIP_MRPROPER=1

          if [ -x build/build.sh ]; then
            build/build.sh \
              2>&1 | tee "${DIST}/logs/experiment-b-buildconfig-build.log"
          elif [ -x build/kernel/build.sh ]; then
            build/kernel/build.sh \
              2>&1 | tee "${DIST}/logs/experiment-b-buildconfig-build.log"
          else
            echo "No build/build.sh or build/kernel/build.sh found."
            exit 1
          fi

          find "${DIST}/modules-buildconfig" -maxdepth 6 -type f \
            | sort \
            | tee "${DIST}/logs/experiment-b-buildconfig-files.txt" || true

      - name: Collect module metadata
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${DIST}/logs" "${DIST}/module-metadata"

          {
            echo "==== All built .ko files ===="
            find "${DIST}" -type f -name "*.ko" | sort || true

            echo
            echo "==== Module metadata ===="
            while read -r ko; do
              [ -f "$ko" ] || continue
              echo
              echo "---- ${ko} ----"
              modinfo "$ko" 2>/dev/null | grep -E "^(filename|name|vermagic|depends|intree|signer|parm):" || true
            done < <(find "${DIST}" -type f -name "*.ko" | sort)
          } | tee "${DIST}/logs/built-module-metadata.txt"

          find "${DIST}" -type f -name "*.ko" -print0 \
            | xargs -0 -I{} sh -c 'cp -av "$1" "${DIST}/module-metadata/" || true' sh {}

      - name: Final collect useful outputs
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${DIST}/final"

          find "${DIST}" -type f \( \
            -name "Image" -o \
            -name "Image.gz" -o \
            -name "Image.lz4" -o \
            -name "Image.lz4-dtb" -o \
            -name "vmlinux" -o \
            -name "System.map" -o \
            -name "*.ko" -o \
            -name "*.img" -o \
            -name "*.dtb" -o \
            -name "*.dtbo" -o \
            -name "modules.order" -o \
            -name "modules.builtin" -o \
            -name "modules.builtin.modinfo" -o \
            -name "Module.symvers" -o \
            -name "abi_symbollist" -o \
            -name "*.symvers" \
          \) -print | sort | tee "${DIST}/logs/final-interesting-files.txt" || true

          while read -r f; do
            [ -f "$f" ] || continue
            cp -av "$f" "${DIST}/final/" || true
          done < "${DIST}/logs/final-interesting-files.txt"

          tar -C "${DIST}" -czf "${{ github.workspace }}/reno12-6.12-k10-experiment-final.tar.gz" \
            final logs k10-analysis module-metadata \
            2>/dev/null || true

          if [ "${{ github.event.inputs.upload_full_dist }}" = "true" ]; then
            tar -C "${DIST}" -czf "${{ github.workspace }}/reno12-6.12-k10-experiment-full-dist.tar.gz" . || true
          fi

          ls -lh "${{ github.workspace }}"/*.tar.gz || true

      - name: Upload final experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reno12-6.12-k10-experiment-final
          path: reno12-6.12-k10-experiment-final.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload full dist
        if: always() && github.event.inputs.upload_full_dist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reno12-6.12-k10-experiment-full-dist
          path: reno12-6.12-k10-experiment-full-dist.tar.gz
          if-no-files-found: warn
          retention-days: 7
