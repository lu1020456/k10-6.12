name: Experiment Reno12 6.12 on K10 MT6895

on:
  workflow_dispatch:
    inputs:
      build_gki:
        description: "Build Reno12 6.12 GKI Image"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      build_modules:
        description: "Build/probe Reno12 6.12 MTK/MGK device modules"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      clone_k10_reference:
        description: "Clone K10 5.10 reference source and analyze DTS"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      strict_fail:
        description: "Fail workflow when build fails"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      upload_full_dist:
        description: "Upload full dist archive"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  experiment:
    name: Reno12 6.12 K10 experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      RENO12_COMMON_REPO: https://github.com/oppo-source/android_kernel_oppo_mt6896.git
      RENO12_MODULES_REPO: https://github.com/oppo-source/android_kernel_modules_oppo_mt6896.git
      RENO12_BRANCH: oppo/mt6896_b_16.0_reno12

      K10_COMMON_REPO: https://github.com/oppo-source/android_kernel_oppo_mt6895.git
      K10_MODULES_REPO: https://github.com/oppo-source/android_kernel_modules_oppo_mt6895.git
      K10_BRANCH: oppo/mt6895_t_13.0.0_k10_5g

      WORKROOT: ${{ github.workspace }}/kernel_platform
      K10ROOT: ${{ github.workspace }}/k10_reference
      DIST: ${{ github.workspace }}/kernel_platform/dist

      BAZEL_FLAGS: "--jobs=6 --keep_going --verbose_failures"

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            file \
            flex \
            git \
            jq \
            kmod \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            make \
            openssl \
            perl \
            python-is-python3 \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd \
            dwarves

          python3 --version
          gcc --version
          clang --version || true
          ld.lld --version || true
          dtc --version || true

      - name: Clone Reno12 6.12 sources
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${WORKROOT}"

          git clone --depth=1 --branch "${RENO12_BRANCH}" \
            "${RENO12_MODULES_REPO}" \
            "${WORKROOT}"

          git clone --depth=1 --branch "${RENO12_BRANCH}" \
            "${RENO12_COMMON_REPO}" \
            "${WORKROOT}/kernel-6.12"

          mkdir -p "${DIST}/logs"

          cd "${WORKROOT}"

          {
            echo "==== WORKROOT ===="
            pwd
            ls -la

            echo
            echo "==== kernel ===="
            ls -la kernel || true

            echo
            echo "==== kernel-6.12 ===="
            ls -la kernel-6.12 | head -120 || true

            echo
            echo "==== kernel symlinks ===="
            find kernel -maxdepth 2 -type l -ls || true

            echo
            echo "==== common kernel version ===="
            grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" kernel-6.12/Makefile || true
          } 2>&1 | tee "${DIST}/logs/clone-reno12-layout.log"

          chmod +x kernel/tools/bazel || true
          chmod +x kernel/build/kernel/kleaf/bazel.sh || true

      - name: Clone K10 5.10 reference sources
        if: ${{ github.event.inputs.clone_k10_reference == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          mkdir -p "${K10ROOT}"
          mkdir -p "${DIST}/logs"

          git clone --depth=1 --branch "${K10_BRANCH}" \
            "${K10_COMMON_REPO}" \
            "${K10ROOT}/kernel-5.10-k10"

          git clone --depth=1 --branch "${K10_BRANCH}" \
            "${K10_MODULES_REPO}" \
            "${K10ROOT}/modules-5.10-k10"

          {
            echo "==== K10 kernel version ===="
            grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" "${K10ROOT}/kernel-5.10-k10/Makefile" || true

            echo
            echo "==== K10 MT6895 DTS files ===="
            find "${K10ROOT}/kernel-5.10-k10/arch/arm64/boot/dts/mediatek" \
              -maxdepth 4 \
              -type f \
              \( -iname "*6895*" -o -iname "*k6895*" -o -iname "*lisa*" -o -iname "*21641*" \) \
              | sort || true

            echo
            echo "==== K10 modules layout ===="
            find "${K10ROOT}/modules-5.10-k10" -maxdepth 4 -type d \
              | sort \
              | head -500 || true
          } 2>&1 | tee "${DIST}/logs/clone-k10-reference-layout.log"

      - name: Sanity check Reno12 6.12 source support
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== current dir ===="
            pwd

            echo
            echo "==== common kernel version ===="
            grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" ../kernel-6.12/Makefile || true

            echo
            echo "==== kernel_device_modules-6.12 ===="
            ls -la kernel_device_modules-6.12 || true

            echo
            echo "==== mt6895 platform marker ===="
            ls -la kernel_device_modules-6.12/mt6895 || true
            cat kernel_device_modules-6.12/mt6895/mgk.enabled || true

            echo
            echo "==== MT6895 DTS base files ===="
            find kernel_device_modules-6.12/arch/arm64/boot/dts \
              -type f \
              \( -iname "*mt6895*" -o -iname "*k6895*" -o -iname "*lisa*" -o -iname "*21641*" \) \
              | sort || true

            echo
            echo "==== MT6895 / K6895 / Lisa / PGJM10 references ===="
            find kernel_device_modules-6.12 ../vendor/mediatek/kernel_modules ../vendor/oplus \
              -type f \
              \( -name "*.c" -o -name "*.h" -o -name "*.dts" -o -name "*.dtsi" -o -name "BUILD.bazel" -o -name "Kbuild" -o -name "Makefile" -o -name "*.mk" -o -name "*.bzl" \) \
              -print0 \
              | xargs -0 grep -In "mt6895\|k6895\|lisa\|21641\|PGJM10" \
              2>/dev/null \
              | head -2000 || true

            echo
            echo "==== vendor mediatek kernel modules ===="
            find ../vendor/mediatek/kernel_modules -maxdepth 4 -type d | sort || true

            echo
            echo "==== vendor oplus modules ===="
            find ../vendor/oplus -maxdepth 4 -type d | sort || true
          } 2>&1 | tee "${DIST}/logs/source-support-mt6895.log"

      - name: Check MT6895 pinctrl clock power-domain support
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== MT6895 pinctrl files ===="
            find kernel_device_modules-6.12 ../kernel-6.12 \
              -type f \
              \( -name "*pinctrl*mt6895*" -o -name "*mt6895*pinctrl*" -o -name "pinctrl-mtk-mt6895.h" \) \
              2>/dev/null | sort || true

            echo
            echo "==== MT6895 clock files ===="
            find kernel_device_modules-6.12 ../kernel-6.12 \
              -type f \
              \( -name "*clk*mt6895*" -o -name "*mt6895*clk*" -o -name "*fmeter*mt6895*" -o -name "*clkchk*mt6895*" -o -name "*clkdbg*mt6895*" \) \
              2>/dev/null | sort || true

            echo
            echo "==== MT6895 power-domain / scpsys / dvfsrc / spm files ===="
            find kernel_device_modules-6.12 ../kernel-6.12 \
              -type f \
              \( -name "*mt6895*power*" -o -name "*mt6895*scpsys*" -o -name "*dvfsrc*" -o -name "*spm*" -o -name "*mt6895*spm*" \) \
              2>/dev/null | sort || true

            echo
            echo "==== MT6895 compatible strings in pinctrl / clk / power ===="
            grep -RIn \
              "mediatek,mt6895\|mt6895" \
              kernel_device_modules-6.12/drivers/pinctrl \
              kernel_device_modules-6.12/drivers/clk \
              kernel_device_modules-6.12/drivers/soc \
              kernel_device_modules-6.12/drivers/misc/mediatek \
              ../kernel-6.12/drivers/pinctrl \
              ../kernel-6.12/drivers/clk \
              ../kernel-6.12/drivers/soc \
              2>/dev/null \
              | head -2000 || true

            echo
            echo "==== MT6895 DT bindings ===="
            find kernel_device_modules-6.12 ../kernel-6.12 \
              -type f \
              \( -path "*dt-bindings*clock*" -o -path "*dt-bindings*power*" -o -path "*dt-bindings*pinctrl*" -o -path "*dt-bindings*reset*" \) \
              2>/dev/null \
              | grep -Ei "mt6895|mtk|mediatek" \
              | sort || true
          } 2>&1 | tee "${DIST}/logs/check-mt6895-pinctrl-clock-powerdomain.log"

      - name: Check MT6895 PMIC regulator charger Type-C support
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== 6.12 regulator drivers ===="
            find kernel_device_modules-6.12/drivers/regulator ../kernel-6.12/drivers/regulator \
              -type f \
              2>/dev/null \
              | grep -Ei "mt6359|mt6363|mt6366|mt6368|mt6369|mt6373|mt6375|mt6379|mt6380|dvfsrc|fan53870|wl2868|rt4803|rt6160|oplus" \
              | sort || true

            echo
            echo "==== 6.12 MFD PMIC drivers ===="
            find kernel_device_modules-6.12/drivers/mfd ../kernel-6.12/drivers/mfd \
              -type f \
              2>/dev/null \
              | grep -Ei "mt635|mt636|mt637|spmi|pmic|oplus" \
              | sort || true

            echo
            echo "==== 6.12 power supply drivers ===="
            find kernel_device_modules-6.12/drivers/power ../kernel-6.12/drivers/power \
              -type f \
              2>/dev/null \
              | grep -Ei "mt6359|mt6375|gauge|charger|battery|pd|pe|ufcs|typec|oplus|vooc|svooc" \
              | sort || true

            echo
            echo "==== 6.12 Type-C / USB / PD drivers ===="
            find kernel_device_modules-6.12/drivers ../kernel-6.12/drivers \
              -type f \
              2>/dev/null \
              | grep -Ei "typec|tcpc|pd|usb.*mt|mt.*usb|ps5170|mt6375" \
              | sort \
              | head -1500 || true

            echo
            echo "==== PMIC / regulator / charger refs in Reno12 6.12 ===="
            grep -RIn \
              "mt6359p\|mt6363\|mt6366\|mt6368\|mt6369\|mt6373\|mt6375\|mt6380\|fan53870\|wl2868\|regulator\|gauge\|charger\|pdc\|typec\|ps5170" \
              kernel_device_modules-6.12 \
              ../vendor/oplus \
              ../vendor/mediatek/kernel_modules \
              2>/dev/null \
              | head -2000 || true
          } 2>&1 | tee "${DIST}/logs/check-mt6895-pmic-regulator-charger-typec.log"

      - name: Analyze K10 DTS references and compatible coverage
        if: ${{ github.event.inputs.clone_k10_reference == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          mkdir -p "${DIST}/logs" "${DIST}/k10-analysis"

          K10_DTS_DIR="${K10ROOT}/kernel-5.10-k10/arch/arm64/boot/dts/mediatek"
          RENO12_SEARCH_ROOTS="${WORKROOT}/kernel/kernel_device_modules-6.12 ${WORKROOT}/kernel-6.12 ${WORKROOT}/vendor/mediatek/kernel_modules ${WORKROOT}/vendor/oplus"

          {
            echo "==== K10 k6895v1_64.dts includes ===="
            grep -RIn "#include" "${K10_DTS_DIR}/k6895v1_64.dts" || true

            echo
            echo "==== K10 key board nodes ===="
            grep -RIn \
              "compatible\|pinctrl-\|pinctrl-names\|clocks\|clock-names\|power-domains\|regulator\|gpio\|panel\|touch\|charger\|gauge\|battery\|typec\|pdc\|ps5170\|connfem\|gps\|nfc\|camera\|imgsensor\|speaker\|amp" \
              "${K10_DTS_DIR}/k6895v1_64.dts" \
              "${K10_DTS_DIR}"/cust_mt6895*.dtsi \
              "${K10_DTS_DIR}"/nfc/*6895* \
              2>/dev/null \
              | head -2500 || true

            echo
            echo "==== K10 PMIC / regulator / charger refs ===="
            grep -RIn \
              "mt6359p\|mt6363\|mt6366\|mt6368\|mt6369\|mt6373\|mt6375\|mt6380\|fan53870\|wl2868\|regulator\|gauge\|charger\|battery\|typec\|pdc\|ps5170" \
              "${K10_DTS_DIR}" \
              2>/dev/null \
              | head -2500 || true

            echo
            echo "==== K10 pinctrl / clock / power-domain refs ===="
            grep -RIn \
              "pinctrl\|eint\|interrupts\|clocks\|clock-names\|power-domains\|scpsys\|dvfsrc\|mmsys\|smi\|iommu" \
              "${K10_DTS_DIR}" \
              2>/dev/null \
              | head -2500 || true
          } 2>&1 | tee "${DIST}/logs/k10-dts-board-analysis.log"

          grep -Rho 'compatible[[:space:]]*=[^;]*;' "${K10_DTS_DIR}" \
            2>/dev/null \
            | sed -E 's/.*compatible[[:space:]]*=[[:space:]]*//; s/;//' \
            | tr ',' '\n' \
            | sed -E 's/[<>]//g; s/"//g; s/^[[:space:]]+//; s/[[:space:]]+$//' \
            | grep -v '^$' \
            | sort -u \
            > "${DIST}/k10-analysis/k10-compatible-list.txt" || true

          wc -l "${DIST}/k10-analysis/k10-compatible-list.txt" \
            | tee "${DIST}/logs/k10-compatible-count.log" || true

          : > "${DIST}/k10-analysis/k10-compatible-found-in-reno12-6.12.txt"
          : > "${DIST}/k10-analysis/k10-compatible-missing-in-reno12-6.12.txt"

          while read -r comp; do
            [ -n "${comp}" ] || continue

            if grep -RIFq "${comp}" ${RENO12_SEARCH_ROOTS} 2>/dev/null; then
              echo "FOUND ${comp}" >> "${DIST}/k10-analysis/k10-compatible-found-in-reno12-6.12.txt"
            else
              echo "MISS ${comp}" >> "${DIST}/k10-analysis/k10-compatible-missing-in-reno12-6.12.txt"
            fi
          done < "${DIST}/k10-analysis/k10-compatible-list.txt"

          {
            echo "==== FOUND compatible in Reno12 6.12 ===="
            cat "${DIST}/k10-analysis/k10-compatible-found-in-reno12-6.12.txt" || true

            echo
            echo "==== MISSING compatible in Reno12 6.12 ===="
            cat "${DIST}/k10-analysis/k10-compatible-missing-in-reno12-6.12.txt" || true
          } 2>&1 | tee "${DIST}/logs/k10-compatible-coverage-report.log"

      - name: Query Bazel targets with full logs
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== pwd ===="
            pwd

            echo
            echo "==== tools/bazel ===="
            ls -la tools/bazel || true
            file tools/bazel || true
            readlink -f tools/bazel || true

            echo
            echo "==== WORKSPACE / MODULE.bazel / BUILD.bazel ===="
            ls -la WORKSPACE MODULE.bazel BUILD.bazel 2>/dev/null || true
            readlink -f WORKSPACE 2>/dev/null || true
            readlink -f MODULE.bazel 2>/dev/null || true
            readlink -f BUILD.bazel 2>/dev/null || true

            echo
            echo "==== build tree sample ===="
            find build -maxdepth 4 -type f | sort | head -500 || true

            echo
            echo "==== bazel version ===="
            ./tools/bazel version || true

            echo
            echo "==== bazel info ===="
            ./tools/bazel info || true

            echo
            echo "==== query //kernel-6.12:* ===="
            ./tools/bazel query '//kernel-6.12:*' || true

            echo
            echo "==== query //kernel_device_modules-6.12:* ===="
            ./tools/bazel query '//kernel_device_modules-6.12:*' || true

            echo
            echo "==== query all interesting ===="
            ./tools/bazel query '//...' 2>&1 \
              | grep -Ei 'mgk|k612|mtk|device|module|dtb|dtbo|dist|mt6895|k6895|gki|aarch64|kernel_aarch64' \
              | sort || true
          } 2>&1 | tee "${DIST}/logs/query-bazel-full.log"

      - name: Experiment A - build Reno12 6.12 GKI Image
        if: ${{ github.event.inputs.build_gki == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/gki" "${DIST}/logs"

          GKI_BUILT=0

          {
            echo "==== Try known GKI targets ===="

            for target in \
              "//kernel-6.12:kernel_aarch64_dist" \
              "//kernel-6.12:gki_aarch64_dist" \
              "//kernel-6.12:kernel_aarch64" \
              "//kernel-6.12:kernel_aarch64_download_or_build" \
              "//kernel-6.12:gki_aarch64" \
              "//kernel-6.12:kernel_images" \
              "//kernel-6.12:kernel"
            do
              echo
              echo "==== Checking ${target} ===="

              if ./tools/bazel query "${target}" >/dev/null 2>&1; then
                echo "FOUND ${target}"

                if echo "${target}" | grep -q "_dist$"; then
                  if ./tools/bazel run ${BAZEL_FLAGS} "${target}" -- --destdir="${DIST}/gki"; then
                    GKI_BUILT=1
                    break
                  fi
                else
                  if ./tools/bazel build ${BAZEL_FLAGS} "${target}"; then
                    GKI_BUILT=1
                    BAZEL_BIN="$(./tools/bazel info bazel-bin 2>/dev/null || true)"
                    if [ -n "${BAZEL_BIN}" ] && [ -d "${BAZEL_BIN}" ]; then
                      find "${BAZEL_BIN}" -type f \( \
                        -name "Image" -o \
                        -name "Image.gz" -o \
                        -name "Image.lz4" -o \
                        -name "vmlinux" -o \
                        -name "System.map" \
                      \) -print | sort > "${DIST}/logs/experiment-a-gki-bazel-files.list" || true

                      while read -r f; do
                        [ -f "$f" ] || continue
                        cp -av "$f" "${DIST}/gki/" || true
                      done < "${DIST}/logs/experiment-a-gki-bazel-files.list"
                    fi
                    break
                  fi
                fi
              else
                echo "MISSING ${target}"
              fi
            done

            echo
            echo "GKI_BUILT=${GKI_BUILT}"

            echo
            echo "==== gki dist files ===="
            find "${DIST}/gki" -maxdepth 5 -type f | sort || true

            echo
            echo "==== bazel-bin interesting image files ===="
            BAZEL_BIN="$(./tools/bazel info bazel-bin 2>/dev/null || true)"
            if [ -n "${BAZEL_BIN}" ] && [ -d "${BAZEL_BIN}" ]; then
              find "${BAZEL_BIN}" -type f \( \
                -name "Image" -o \
                -name "Image.gz" -o \
                -name "Image.lz4" -o \
                -name "vmlinux" -o \
                -name "System.map" \
              \) -print | sort || true
            fi
          } 2>&1 | tee "${DIST}/logs/experiment-a-gki-full.log"

          echo "GKI_BUILT=${GKI_BUILT}" > "${DIST}/logs/experiment-a-gki-result.txt"

          if [ "${GKI_BUILT}" != "1" ] && [ "${{ github.event.inputs.strict_fail }}" = "true" ]; then
            exit 1
          fi

      - name: Experiment B - build MT6895 MGK device modules by Bazel
        if: ${{ github.event.inputs.build_modules == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/modules-bazel" "${DIST}/logs"

          MODULES_BUILT=0

          {
            echo "==== Query candidate module targets ===="
            ./tools/bazel query '//kernel_device_modules-6.12:*' 2>&1 \
              | sort \
              | tee "${DIST}/logs/experiment-b-module-targets.raw" || true

            echo
            echo "==== Candidate filtered targets ===="
            cat "${DIST}/logs/experiment-b-module-targets.raw" \
              | grep -Ei 'mgk_64_k612|mgk|k612|dist|module|dtb|dtbo' \
              | sort || true

            echo
            echo "==== Try known module targets ===="

            for target in \
              "//kernel_device_modules-6.12:mgk_64_k612_dist" \
              "//kernel_device_modules-6.12:mgk_64_k612" \
              "//kernel_device_modules-6.12:kernel_device_modules_dist" \
              "//kernel_device_modules-6.12:kernel_device_modules" \
              "//kernel_device_modules-6.12:modules" \
              "//kernel_device_modules-6.12:dtbs" \
              "//kernel_device_modules-6.12:dtbo"
            do
              echo
              echo "==== Checking ${target} ===="

              if ./tools/bazel query "${target}" >/dev/null 2>&1; then
                echo "FOUND ${target}"

                if echo "${target}" | grep -q "_dist$"; then
                  if ./tools/bazel run ${BAZEL_FLAGS} "${target}" -- --destdir="${DIST}/modules-bazel"; then
                    MODULES_BUILT=1
                    break
                  fi
                else
                  if ./tools/bazel build ${BAZEL_FLAGS} "${target}"; then
                    MODULES_BUILT=1

                    BAZEL_BIN="$(./tools/bazel info bazel-bin 2>/dev/null || true)"
                    if [ -n "${BAZEL_BIN}" ] && [ -d "${BAZEL_BIN}" ]; then
                      find "${BAZEL_BIN}" -type f \( \
                        -name "*.ko" -o \
                        -name "*.dtb" -o \
                        -name "*.dtbo" -o \
                        -name "modules.order" -o \
                        -name "Module.symvers" -o \
                        -name "*.symvers" \
                      \) -print | sort > "${DIST}/logs/experiment-b-bazel-built-files.list" || true

                      while read -r f; do
                        [ -f "$f" ] || continue
                        cp -av "$f" "${DIST}/modules-bazel/" || true
                      done < "${DIST}/logs/experiment-b-bazel-built-files.list"
                    fi
                    break
                  fi
                fi
              else
                echo "MISSING ${target}"
              fi
            done

            echo
            echo "MODULES_BUILT=${MODULES_BUILT}"

            echo
            echo "==== module dist files ===="
            find "${DIST}/modules-bazel" -maxdepth 8 -type f | sort || true

            echo
            echo "==== bazel-bin interesting module files ===="
            BAZEL_BIN="$(./tools/bazel info bazel-bin 2>/dev/null || true)"
            if [ -n "${BAZEL_BIN}" ] && [ -d "${BAZEL_BIN}" ]; then
              find "${BAZEL_BIN}" -type f \( \
                -name "*.ko" -o \
                -name "*.dtb" -o \
                -name "*.dtbo" -o \
                -name "modules.order" -o \
                -name "Module.symvers" -o \
                -name "*.symvers" \
              \) -print | sort || true
            fi
          } 2>&1 | tee "${DIST}/logs/experiment-b-modules-bazel-full.log"

          echo "MODULES_BUILT=${MODULES_BUILT}" > "${DIST}/logs/experiment-b-modules-result.txt"

          if [ "${MODULES_BUILT}" != "1" ] && [ "${{ github.event.inputs.strict_fail }}" = "true" ]; then
            exit 1
          fi

      - name: Experiment B fallback - build via build.config.mtk_kernel_device_modules
        if: ${{ github.event.inputs.build_modules == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/modules-buildconfig" "${DIST}/logs"

          CONFIG="kernel_device_modules-6.12/build.config.mtk_kernel_device_modules"

          {
            echo "==== build config path ===="
            echo "${CONFIG}"

            echo
            echo "==== build config content ===="
            cat "${CONFIG}" || true

            echo
            echo "==== build scripts ===="
            ls -la build || true
            ls -la build/build.sh 2>/dev/null || true
            ls -la build/kernel/build.sh 2>/dev/null || true

            export BUILD_CONFIG="${CONFIG}"
            export DIST_DIR="${DIST}/modules-buildconfig"
            export OUT_DIR="${WORKROOT}/out/modules-buildconfig"
            export SKIP_MRPROPER=1

            echo
            echo "==== env ===="
            env | sort | grep -E "BUILD_CONFIG|DIST_DIR|OUT_DIR|SKIP_MRPROPER|PATH|LLVM|ARCH" || true

            echo
            echo "==== run build_config build ===="
            if [ -x build/build.sh ]; then
              build/build.sh
            elif [ -x build/kernel/build.sh ]; then
              build/kernel/build.sh
            else
              echo "No build/build.sh or build/kernel/build.sh found."
              exit 1
            fi

            echo
            echo "==== buildconfig output files ===="
            find "${DIST}/modules-buildconfig" -maxdepth 8 -type f | sort || true
          } 2>&1 | tee "${DIST}/logs/experiment-b-buildconfig-full.log"

      - name: Collect module metadata
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${DIST}/logs" "${DIST}/module-metadata"

          {
            echo "==== All built .ko files ===="
            find "${DIST}" -type f -name "*.ko" | sort || true

            echo
            echo "==== Module metadata ===="
            while read -r ko; do
              [ -f "$ko" ] || continue
              echo
              echo "---- ${ko} ----"
              modinfo "$ko" 2>/dev/null | grep -E "^(filename|name|vermagic|depends|intree|signer|parm):" || true
            done < <(find "${DIST}" -type f -name "*.ko" | sort)
          } 2>&1 | tee "${DIST}/logs/built-module-metadata.log"

          while read -r ko; do
            [ -f "$ko" ] || continue
            cp -av "$ko" "${DIST}/module-metadata/" || true
          done < <(find "${DIST}" -type f -name "*.ko" | sort)

      - name: Final collect useful outputs
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${DIST}/final"

          find "${DIST}" -type f \( \
            -name "Image" -o \
            -name "Image.gz" -o \
            -name "Image.lz4" -o \
            -name "Image.lz4-dtb" -o \
            -name "vmlinux" -o \
            -name "System.map" -o \
            -name "*.ko" -o \
            -name "*.img" -o \
            -name "*.dtb" -o \
            -name "*.dtbo" -o \
            -name "modules.order" -o \
            -name "modules.builtin" -o \
            -name "modules.builtin.modinfo" -o \
            -name "Module.symvers" -o \
            -name "abi_symbollist" -o \
            -name "*.symvers" \
          \) -print | sort | tee "${DIST}/logs/final-interesting-files.log" || true

          while read -r f; do
            [ -f "$f" ] || continue
            cp -av "$f" "${DIST}/final/" || true
          done < "${DIST}/logs/final-interesting-files.log"

          echo "==== final files ===="
          find "${DIST}/final" -maxdepth 2 -type f | sort || true

          echo "==== logs ===="
          find "${DIST}/logs" -maxdepth 1 -type f | sort || true

          tar -C "${DIST}" -czf "${{ github.workspace }}/reno12-6.12-k10-experiment-final.tar.gz" \
            final logs k10-analysis module-metadata \
            2>/dev/null || true

          if [ "${{ github.event.inputs.upload_full_dist }}" = "true" ]; then
            tar -C "${DIST}" -czf "${{ github.workspace }}/reno12-6.12-k10-experiment-full-dist.tar.gz" . || true
          fi

          ls -lh "${{ github.workspace }}"/*.tar.gz || true

      - name: Upload final experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reno12-6.12-k10-experiment-final
          path: reno12-6.12-k10-experiment-final.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload full dist
        if: always() && github.event.inputs.upload_full_dist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reno12-6.12-k10-experiment-full-dist
          path: reno12-6.12-k10-experiment-full-dist.tar.gz
          if-no-files-found: warn
          retention-days: 7