name: Build Reno12 6.12 GKI and MTK modules

on:
  workflow_dispatch:
    inputs:
      build_gki:
        description: "Build Reno12 6.12 GKI Image"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      build_modules:
        description: "Build Reno12 6.12 MTK/MGK device modules"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      strict_fail:
        description: "Fail workflow when build fails"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      upload_full_dist:
        description: "Upload full dist archive"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  build:
    name: Build Reno12 6.12
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      RENO12_COMMON_REPO: https://github.com/oppo-source/android_kernel_oppo_mt6896.git
      RENO12_MODULES_REPO: https://github.com/oppo-source/android_kernel_modules_oppo_mt6896.git
      RENO12_BRANCH: oppo/mt6896_b_16.0_reno12

      WORKROOT: ${{ github.workspace }}/kernel_platform
      DIST: ${{ github.workspace }}/kernel_platform/dist

      BAZEL_FLAGS: "--jobs=6 --keep_going --verbose_failures"

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean

          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            file \
            flex \
            git \
            jq \
            kmod \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            make \
            openssl \
            perl \
            python-is-python3 \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd \
            dwarves

          python3 --version
          gcc --version
          clang --version || true
          ld.lld --version || true
          dtc --version || true

      - name: Clone Reno12 6.12 sources
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${WORKROOT}"

          git clone --depth=1 --branch "${RENO12_BRANCH}" \
            "${RENO12_MODULES_REPO}" \
            "${WORKROOT}"

          git clone --depth=1 --branch "${RENO12_BRANCH}" \
            "${RENO12_COMMON_REPO}" \
            "${WORKROOT}/kernel-6.12"

          mkdir -p "${DIST}/logs"

          cd "${WORKROOT}"

          {
            echo "==== WORKROOT ===="
            pwd
            ls -la

            echo
            echo "==== kernel ===="
            ls -la kernel || true

            echo
            echo "==== kernel-6.12 ===="
            ls -la kernel-6.12 | head -120 || true

            echo
            echo "==== common kernel version ===="
            grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" kernel-6.12/Makefile || true

            echo
            echo "==== kernel symlinks ===="
            find kernel -maxdepth 2 -type l -ls || true
          } 2>&1 | tee "${DIST}/logs/clone-reno12-layout.log"

          chmod +x kernel/tools/bazel || true
          chmod +x kernel/build/kernel/kleaf/bazel.sh || true
          chmod +x kernel/build/kernel/kleaf/bazel.origin.sh || true

      - name: Clone required AOSP Kleaf prebuilts
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"
          mkdir -p prebuilts

          {
            echo "==== Clone prebuilts/build-tools ===="
            if [ ! -d prebuilts/build-tools ]; then
              git clone --depth=1 \
                https://android.googlesource.com/platform/prebuilts/build-tools \
                prebuilts/build-tools
            fi

            echo
            echo "==== Clone prebuilts/bazel/linux-x86_64 ===="
            if [ ! -d prebuilts/bazel/linux-x86_64 ]; then
              mkdir -p prebuilts/bazel
              git clone --depth=1 \
                https://android.googlesource.com/platform/prebuilts/bazel/linux-x86_64 \
                prebuilts/bazel/linux-x86_64
            fi

            echo
            echo "==== Clone prebuilts/clang/host/linux-x86 ===="
            if [ ! -d prebuilts/clang/host/linux-x86 ]; then
              mkdir -p prebuilts/clang/host
              git clone --depth=1 \
                https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
                prebuilts/clang/host/linux-x86
            fi

            echo
            echo "==== Clone prebuilts/rust/linux-x86 ===="
            if [ ! -d prebuilts/rust/linux-x86 ]; then
              mkdir -p prebuilts/rust
              git clone --depth=1 \
                https://android.googlesource.com/platform/prebuilts/rust/linux-x86 \
                prebuilts/rust/linux-x86
            fi

            echo
            echo "==== Clone prebuilts/jdk/jdk17/linux-x86 ===="
            if [ ! -d prebuilts/jdk/jdk17/linux-x86 ]; then
              mkdir -p prebuilts/jdk/jdk17
              git clone --depth=1 \
                https://android.googlesource.com/platform/prebuilts/jdk/jdk17/linux-x86 \
                prebuilts/jdk/jdk17/linux-x86 || true
            fi

            echo
            echo "==== Required files ===="
            ls -la prebuilts/build-tools/linux_musl-x86/bin/py3-cmd || true

            echo
            echo "==== Bazel prebuilt sample ===="
            find prebuilts/bazel/linux-x86_64 -maxdepth 4 -type f | sort | head -80 || true

            echo
            echo "==== Clang sample ===="
            find prebuilts/clang/host/linux-x86 -maxdepth 5 -type f -name clang | sort | head -20 || true

            echo
            echo "==== Rust sample ===="
            find prebuilts/rust/linux-x86 -maxdepth 6 -type f -name rustc | sort | head -20 || true
          } 2>&1 | tee "${DIST}/logs/clone-kleaf-prebuilts.log"

      - name: Verify Bazel launcher
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== py3-cmd ===="
            ls -la prebuilts/build-tools/linux_musl-x86/bin/py3-cmd || true
            file prebuilts/build-tools/linux_musl-x86/bin/py3-cmd || true

            echo
            echo "==== tools/bazel ===="
            ls -la tools/bazel || true
            file tools/bazel || true
            readlink -f tools/bazel || true

            echo
            echo "==== bazel.origin.sh first lines ===="
            sed -n '1,80p' build/kernel/kleaf/bazel.origin.sh || true

            echo
            echo "==== tools/bazel version ===="
            ./tools/bazel version || true

            echo
            echo "==== tools/bazel info ===="
            ./tools/bazel info || true
          } 2>&1 | tee "${DIST}/logs/verify-bazel-launcher.log"

      - name: Query Bazel targets
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== pwd ===="
            pwd

            echo
            echo "==== WORKSPACE / MODULE.bazel / BUILD.bazel ===="
            ls -la WORKSPACE MODULE.bazel BUILD.bazel 2>/dev/null || true
            readlink -f WORKSPACE 2>/dev/null || true
            readlink -f MODULE.bazel 2>/dev/null || true
            readlink -f BUILD.bazel 2>/dev/null || true

            echo
            echo "==== bazel version ===="
            ./tools/bazel version || true

            echo
            echo "==== bazel info ===="
            ./tools/bazel info || true

            echo
            echo "==== query //kernel-6.12:* ===="
            ./tools/bazel query '//kernel-6.12:*' || true

            echo
            echo "==== query //kernel_device_modules-6.12:* ===="
            ./tools/bazel query '//kernel_device_modules-6.12:*' || true

            echo
            echo "==== query all interesting ===="
            ./tools/bazel query '//...' 2>&1 \
              | grep -Ei 'mgk|k612|mtk|device|module|dtb|dtbo|dist|mt6895|k6895|gki|aarch64|kernel_aarch64' \
              | sort || true
          } 2>&1 | tee "${DIST}/logs/query-bazel-targets.log"

      - name: Build GKI Image
        if: ${{ github.event.inputs.build_gki == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/gki" "${DIST}/logs"

          GKI_BUILT=0

          {
            echo "==== Try known GKI targets ===="

            for target in \
              "//kernel-6.12:kernel_aarch64_dist" \
              "//kernel-6.12:gki_aarch64_dist" \
              "//kernel-6.12:kernel_aarch64" \
              "//kernel-6.12:kernel_aarch64_download_or_build" \
              "//kernel-6.12:gki_aarch64" \
              "//kernel-6.12:kernel_images" \
              "//kernel-6.12:kernel"
            do
              echo
              echo "==== Checking ${target} ===="

              if ./tools/bazel query "${target}" >/dev/null 2>&1; then
                echo "FOUND ${target}"

                if echo "${target}" | grep -q "_dist$"; then
                  if ./tools/bazel run ${BAZEL_FLAGS} "${target}" -- --destdir="${DIST}/gki"; then
                    GKI_BUILT=1
                    break
                  fi
                else
                  if ./tools/bazel build ${BAZEL_FLAGS} "${target}"; then
                    GKI_BUILT=1

                    BAZEL_BIN="$(./tools/bazel info bazel-bin 2>/dev/null || true)"

                    if [ -n "${BAZEL_BIN}" ] && [ -d "${BAZEL_BIN}" ]; then
                      find "${BAZEL_BIN}" -type f \( \
                        -name "Image" -o \
                        -name "Image.gz" -o \
                        -name "Image.lz4" -o \
                        -name "vmlinux" -o \
                        -name "System.map" \
                      \) -print | sort > "${DIST}/logs/gki-bazel-files.list" || true

                      while read -r f; do
                        [ -f "$f" ] || continue
                        cp -av "$f" "${DIST}/gki/" || true
                      done < "${DIST}/logs/gki-bazel-files.list"
                    fi

                    break
                  fi
                fi
              else
                echo "MISSING ${target}"
              fi
            done

            echo
            echo "GKI_BUILT=${GKI_BUILT}"

            echo
            echo "==== gki output files ===="
            find "${DIST}/gki" -maxdepth 5 -type f | sort || true

            echo
            echo "==== bazel-bin image files ===="
            BAZEL_BIN="$(./tools/bazel info bazel-bin 2>/dev/null || true)"
            if [ -n "${BAZEL_BIN}" ] && [ -d "${BAZEL_BIN}" ]; then
              find "${BAZEL_BIN}" -type f \( \
                -name "Image" -o \
                -name "Image.gz" -o \
                -name "Image.lz4" -o \
                -name "vmlinux" -o \
                -name "System.map" \
              \) -print | sort || true
            fi
          } 2>&1 | tee "${DIST}/logs/build-gki.log"

          echo "GKI_BUILT=${GKI_BUILT}" > "${DIST}/logs/build-gki-result.txt"

          if [ "${GKI_BUILT}" != "1" ] && [ "${{ github.event.inputs.strict_fail }}" = "true" ]; then
            exit 1
          fi

      - name: Build MTK/MGK device modules
        if: ${{ github.event.inputs.build_modules == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/modules-bazel" "${DIST}/logs"

          MODULES_BUILT=0

          {
            echo "==== Query module targets ===="
            ./tools/bazel query '//kernel_device_modules-6.12:*' 2>&1 \
              | sort \
              | tee "${DIST}/logs/module-targets.raw" || true

            echo
            echo "==== Filtered module targets ===="
            cat "${DIST}/logs/module-targets.raw" \
              | grep -Ei 'mgk_64_k612|mgk|k612|dist|module|dtb|dtbo' \
              | sort || true

            echo
            echo "==== Try known module targets ===="

            for target in \
              "//kernel_device_modules-6.12:mgk_64_k612_dist" \
              "//kernel_device_modules-6.12:mgk_64_k612" \
              "//kernel_device_modules-6.12:kernel_device_modules_dist" \
              "//kernel_device_modules-6.12:kernel_device_modules" \
              "//kernel_device_modules-6.12:modules" \
              "//kernel_device_modules-6.12:dtbs" \
              "//kernel_device_modules-6.12:dtbo"
            do
              echo
              echo "==== Checking ${target} ===="

              if ./tools/bazel query "${target}" >/dev/null 2>&1; then
                echo "FOUND ${target}"

                if echo "${target}" | grep -q "_dist$"; then
                  if ./tools/bazel run ${BAZEL_FLAGS} "${target}" -- --destdir="${DIST}/modules-bazel"; then
                    MODULES_BUILT=1
                    break
                  fi
                else
                  if ./tools/bazel build ${BAZEL_FLAGS} "${target}"; then
                    MODULES_BUILT=1

                    BAZEL_BIN="$(./tools/bazel info bazel-bin 2>/dev/null || true)"

                    if [ -n "${BAZEL_BIN}" ] && [ -d "${BAZEL_BIN}" ]; then
                      find "${BAZEL_BIN}" -type f \( \
                        -name "*.ko" -o \
                        -name "*.dtb" -o \
                        -name "*.dtbo" -o \
                        -name "modules.order" -o \
                        -name "Module.symvers" -o \
                        -name "*.symvers" \
                      \) -print | sort > "${DIST}/logs/modules-bazel-files.list" || true

                      while read -r f; do
                        [ -f "$f" ] || continue
                        cp -av "$f" "${DIST}/modules-bazel/" || true
                      done < "${DIST}/logs/modules-bazel-files.list"
                    fi

                    break
                  fi
                fi
              else
                echo "MISSING ${target}"
              fi
            done

            echo
            echo "MODULES_BUILT=${MODULES_BUILT}"

            echo
            echo "==== module output files ===="
            find "${DIST}/modules-bazel" -maxdepth 8 -type f | sort || true

            echo
            echo "==== bazel-bin module files ===="
            BAZEL_BIN="$(./tools/bazel info bazel-bin 2>/dev/null || true)"
            if [ -n "${BAZEL_BIN}" ] && [ -d "${BAZEL_BIN}" ]; then
              find "${BAZEL_BIN}" -type f \( \
                -name "*.ko" -o \
                -name "*.dtb" -o \
                -name "*.dtbo" -o \
                -name "modules.order" -o \
                -name "Module.symvers" -o \
                -name "*.symvers" \
              \) -print | sort || true
            fi
          } 2>&1 | tee "${DIST}/logs/build-modules.log"

          echo "MODULES_BUILT=${MODULES_BUILT}" > "${DIST}/logs/build-modules-result.txt"

          if [ "${MODULES_BUILT}" != "1" ] && [ "${{ github.event.inputs.strict_fail }}" = "true" ]; then
            exit 1
          fi

      - name: Collect module metadata
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${DIST}/logs" "${DIST}/module-metadata"

          {
            echo "==== All built .ko files ===="
            find "${DIST}" -type f -name "*.ko" | sort || true

            echo
            echo "==== Module metadata ===="
            while read -r ko; do
              [ -f "$ko" ] || continue
              echo
              echo "---- ${ko} ----"
              modinfo "$ko" 2>/dev/null | grep -E "^(filename|name|vermagic|depends|intree|signer|parm):" || true
            done < <(find "${DIST}" -type f -name "*.ko" | sort)
          } 2>&1 | tee "${DIST}/logs/built-module-metadata.log"

          while read -r ko; do
            [ -f "$ko" ] || continue
            cp -av "$ko" "${DIST}/module-metadata/" || true
          done < <(find "${DIST}" -type f -name "*.ko" | sort)

      - name: Collect outputs
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${DIST}/final"

          find "${DIST}" -type f \( \
            -name "Image" -o \
            -name "Image.gz" -o \
            -name "Image.lz4" -o \
            -name "Image.lz4-dtb" -o \
            -name "vmlinux" -o \
            -name "System.map" -o \
            -name "*.ko" -o \
            -name "*.img" -o \
            -name "*.dtb" -o \
            -name "*.dtbo" -o \
            -name "modules.order" -o \
            -name "modules.builtin" -o \
            -name "modules.builtin.modinfo" -o \
            -name "Module.symvers" -o \
            -name "abi_symbollist" -o \
            -name "*.symvers" \
          \) -print | sort | tee "${DIST}/logs/final-interesting-files.log" || true

          while read -r f; do
            [ -f "$f" ] || continue
            cp -av "$f" "${DIST}/final/" || true
          done < "${DIST}/logs/final-interesting-files.log"

          echo "==== final files ===="
          find "${DIST}/final" -maxdepth 2 -type f | sort || true

          echo "==== logs ===="
          find "${DIST}/logs" -maxdepth 1 -type f | sort || true

          tar -C "${DIST}" -czf "${{ github.workspace }}/reno12-6.12-build-final.tar.gz" \
            final logs module-metadata \
            2>/dev/null || true

          if [ "${{ github.event.inputs.upload_full_dist }}" = "true" ]; then
            tar -C "${DIST}" -czf "${{ github.workspace }}/reno12-6.12-build-full-dist.tar.gz" . || true
          fi

          ls -lh "${{ github.workspace }}"/*.tar.gz || true

      - name: Upload final artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reno12-6.12-build-final
          path: reno12-6.12-build-final.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload full dist
        if: ${{ always() && github.event.inputs.upload_full_dist == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: reno12-6.12-build-full-dist
          path: reno12-6.12-build-full-dist.tar.gz
          if-no-files-found: warn
          retention-days: 7