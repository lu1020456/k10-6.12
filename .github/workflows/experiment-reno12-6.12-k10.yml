name: Build Reno12 6.12 GKI and MTK modules

on:
  workflow_dispatch:
    inputs:
      build_gki:
        description: "Build Reno12 6.12 GKI Image"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      build_modules:
        description: "Build Reno12 6.12 MTK/MGK device modules"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      clone_ndk:
        description: "Clone platform/prebuilts/ndk as prebuilts/ndk-r27"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      strict_fail:
        description: "Fail workflow when build fails"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      upload_full_dist:
        description: "Upload full dist archive"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  build:
    name: Build Reno12 6.12
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      RENO12_COMMON_REPO: https://github.com/oppo-source/android_kernel_oppo_mt6896.git
      RENO12_MODULES_REPO: https://github.com/oppo-source/android_kernel_modules_oppo_mt6896.git
      RENO12_BRANCH: oppo/mt6896_b_16.0_reno12

      WORKROOT: ${{ github.workspace }}/kernel_platform
      DIST: ${{ github.workspace }}/kernel_platform/dist

      # Important:
      # This must match the real Bazel package name.
      # The package //kernel-6.12 contains build.config.constants.
      KERNEL_VERSION: "kernel-6.12"

      BAZEL_FLAGS: "--jobs=6 --keep_going --verbose_failures"

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean

          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            file \
            flex \
            git \
            jq \
            kmod \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            make \
            openssl \
            perl \
            python-is-python3 \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd \
            dwarves

          python3 --version
          gcc --version
          clang --version || true
          ld.lld --version || true
          dtc --version || true

      - name: Clone Reno12 6.12 sources
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${WORKROOT}"

          git clone --depth=1 --branch "${RENO12_BRANCH}" \
            "${RENO12_MODULES_REPO}" \
            "${WORKROOT}"

          git clone --depth=1 --branch "${RENO12_BRANCH}" \
            "${RENO12_COMMON_REPO}" \
            "${WORKROOT}/kernel-6.12"

          mkdir -p "${DIST}/logs"

          cd "${WORKROOT}"

          {
            echo "==== WORKROOT ===="
            pwd
            ls -la

            echo
            echo "==== kernel ===="
            ls -la kernel || true

            echo
            echo "==== kernel-6.12 ===="
            ls -la kernel-6.12 | head -120 || true

            echo
            echo "==== common kernel version ===="
            grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" kernel-6.12/Makefile || true

            echo
            echo "==== kernel symlinks ===="
            find kernel -maxdepth 2 -type l -ls || true

            echo
            echo "==== verify build.config.constants ===="
            ls -la kernel-6.12/build.config.constants || true
            cat kernel-6.12/build.config.constants || true
          } 2>&1 | tee "${DIST}/logs/clone-reno12-layout.log"

          chmod +x kernel/tools/bazel || true
          chmod +x kernel/build/kernel/kleaf/bazel.sh || true
          chmod +x kernel/build/kernel/kleaf/bazel.origin.sh || true

      - name: Clone AOSP prebuilts and Bazel externals
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          clone_aosp() {
            local repo="$1"
            local dest="$2"

            if [ -d "${dest}/.git" ]; then
              echo "Already cloned: ${dest}"
              return 0
            fi

            rm -rf "${dest}"
            mkdir -p "$(dirname "${dest}")"

            echo
            echo "==== Clone ${repo} -> ${dest} ===="

            for branch in android16-release android16-qpr2-release android16-qpr1-release main-kernel main-kernel-2026 main-kernel-2025 main-kernel-build-2024 main master; do
              echo "Trying branch ${branch}"
              if git clone --depth=1 --branch "${branch}" \
                "https://android.googlesource.com/${repo}" \
                "${dest}"; then
                echo "Cloned ${repo} branch ${branch}"
                return 0
              fi

              rm -rf "${dest}"
            done

            echo "Trying default branch"
            git clone --depth=1 \
              "https://android.googlesource.com/${repo}" \
              "${dest}"
          }

          {
            echo "==== Clone required prebuilts ===="

            clone_aosp "platform/prebuilts/build-tools" \
              "prebuilts/build-tools"

            clone_aosp "kernel/prebuilts/build-tools" \
              "prebuilts/kernel-build-tools"

            clone_aosp "platform/prebuilts/clang/host/linux-x86" \
              "prebuilts/clang/host/linux-x86"

            clone_aosp "platform/prebuilts/rust" \
              "prebuilts/rust"

            clone_aosp "platform/prebuilts/jdk/jdk17" \
              "prebuilts/jdk/jdk17"

            if [ "${{ github.event.inputs.clone_ndk }}" = "true" ]; then
              clone_aosp "platform/prebuilts/ndk" \
                "prebuilts/ndk-r27"
            fi

            echo
            echo "==== Clone Bazel / Bzlmod external repositories ===="

            clone_aosp "platform/external/bazelbuild-bazel-central-registry" \
              "external/bazelbuild-bazel-central-registry"

            clone_aosp "platform/external/bazel-skylib" \
              "external/bazel-skylib"

            clone_aosp "platform/external/bazelbuild-platforms" \
              "external/bazelbuild-platforms"

            clone_aosp "platform/external/bazelbuild-rules_cc" \
              "external/bazelbuild-rules_cc"

            clone_aosp "platform/external/bazelbuild-rules_license" \
              "external/bazelbuild-rules_license"

            clone_aosp "platform/external/bazelbuild-rules_pkg" \
              "external/bazelbuild-rules_pkg"

            clone_aosp "platform/external/bazelbuild-rules_python" \
              "external/bazelbuild-rules_python"

            clone_aosp "platform/external/bazelbuild-rules_shell" \
              "external/bazelbuild-rules_shell"

            clone_aosp "platform/external/bazel-contrib-bazel_features" \
              "external/bazel-contrib-bazel_features"

            clone_aosp "platform/external/python/absl-py" \
              "external/python/absl-py"

            echo
            echo "==== Clone Kleaf host tool source repositories ===="

            clone_aosp "platform/external/libcap" \
              "external/libcap"

            clone_aosp "platform/external/libcap-ng" \
              "external/libcap-ng"

            clone_aosp "platform/external/lz4" \
              "external/lz4"

            clone_aosp "platform/external/toybox" \
              "external/toybox"

            clone_aosp "platform/external/zlib" \
              "external/zlib"

            clone_aosp "platform/external/zopfli" \
              "external/zopfli"

            clone_aosp "platform/external/pigz" \
              "external/pigz"

            echo
            echo "==== Required py3-cmd ===="
            ls -la prebuilts/build-tools/linux_musl-x86/bin/py3-cmd || true
            file prebuilts/build-tools/linux_musl-x86/bin/py3-cmd || true

            echo
            echo "==== Required kernel bazel ===="
            ls -la prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel || true
            file prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel || true
            chmod +x prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel || true

            echo
            echo "==== Clang sample ===="
            find prebuilts/clang/host/linux-x86 -maxdepth 5 -type f -name clang | sort | head -20 || true

            echo
            echo "==== Rust sample ===="
            find prebuilts/rust -maxdepth 8 -type f -name rustc | sort | head -20 || true

            echo
            echo "==== JDK sample ===="
            find prebuilts/jdk -maxdepth 8 -type f -name java | sort | head -20 || true

            echo
            echo "==== NDK sample ===="
            find prebuilts/ndk-r27 -maxdepth 4 -type f | sort | head -40 || true

            echo
            echo "==== Bazel Central Registry stardoc sample ===="
            ls -la external/bazelbuild-bazel-central-registry/modules/stardoc/0.7.2/MODULE.bazel || true

            echo
            echo "==== External repository summary ===="
            for d in \
              external/bazelbuild-bazel-central-registry \
              external/bazel-skylib \
              external/bazelbuild-platforms \
              external/bazelbuild-rules_cc \
              external/bazelbuild-rules_license \
              external/bazelbuild-rules_pkg \
              external/bazelbuild-rules_python \
              external/bazelbuild-rules_shell \
              external/bazel-contrib-bazel_features \
              external/python/absl-py \
              external/libcap \
              external/libcap-ng \
              external/lz4 \
              external/toybox \
              external/zlib \
              external/zopfli \
              external/pigz
            do
              echo
              echo "---- ${d} ----"
              test -d "${d}" && git -C "${d}" log -1 --oneline || true
              ls -la "${d}" 2>/dev/null | head -20 || true
            done
          } 2>&1 | tee "${DIST}/logs/clone-aosp-deps.log"

      - name: Patch local Bazel workspace
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== KERNEL_VERSION ===="
            echo "KERNEL_VERSION=${KERNEL_VERSION}"

            echo
            echo "==== Ensure common kernel package is visible ===="
            ls -la kernel-6.12 || true
            ls -la kernel-6.12/BUILD.bazel || true
            ls -la kernel-6.12/build.config.constants || true

            echo
            echo "==== Patch missing BUILD files for local .bzl packages ===="

            touch build/BUILD.bazel

            mkdir -p build/bazel_common_rules
            touch build/bazel_common_rules/BUILD.bazel

            mkdir -p build/bazel_common_rules/dist
            touch build/bazel_common_rules/dist/BUILD.bazel

            echo
            echo "==== Verify patched BUILD files ===="
            ls -la build/BUILD.bazel || true
            ls -la build/bazel_common_rules/BUILD.bazel || true
            ls -la build/bazel_common_rules/dist/BUILD.bazel || true

            echo
            echo "==== dist.bzl ===="
            ls -la build/bazel_common_rules/dist/dist.bzl || true
            sed -n '1,120p' build/bazel_common_rules/dist/dist.bzl || true
          } 2>&1 | tee "${DIST}/logs/patch-local-bazel-workspace.log"

      - name: Verify Bazel launcher
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== KERNEL_VERSION ===="
            echo "KERNEL_VERSION=${KERNEL_VERSION}"

            echo
            echo "==== py3-cmd ===="
            ls -la prebuilts/build-tools/linux_musl-x86/bin/py3-cmd || true
            file prebuilts/build-tools/linux_musl-x86/bin/py3-cmd || true

            echo
            echo "==== kernel-build-tools bazel ===="
            ls -la prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel || true
            file prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel || true
            prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel --version || true

            echo
            echo "==== Bazel Central Registry stardoc check ===="
            ls -la external/bazelbuild-bazel-central-registry/modules/stardoc/0.7.2/MODULE.bazel || true
            sed -n '1,80p' external/bazelbuild-bazel-central-registry/modules/stardoc/0.7.2/MODULE.bazel 2>/dev/null || true

            echo
            echo "==== tools/bazel ===="
            ls -la tools/bazel || true
            file tools/bazel || true
            readlink -f tools/bazel || true

            echo
            echo "==== bazel.origin.sh first lines ===="
            sed -n '1,180p' build/kernel/kleaf/bazel.origin.sh || true

            echo
            echo "==== MODULE.bazel ===="
            cat MODULE.bazel || true

            echo
            echo "==== WORKSPACE ===="
            cat WORKSPACE || true

            echo
            echo "==== tools/bazel version ===="
            ./tools/bazel version || true

            echo
            echo "==== tools/bazel info ===="
            ./tools/bazel info || true
          } 2>&1 | tee "${DIST}/logs/verify-bazel-launcher.log"

      - name: Query Bazel targets
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/logs"

          {
            echo "==== pwd ===="
            pwd

            echo
            echo "==== package visibility ===="
            ls -la kernel-6.12/BUILD.bazel || true
            ls -la kernel-6.12/build.config.constants || true

            echo
            echo "==== bazel version ===="
            ./tools/bazel version || true

            echo
            echo "==== bazel info ===="
            ./tools/bazel info || true

            echo
            echo "==== query //kernel-6.12:* ===="
            ./tools/bazel query '//kernel-6.12:*' | tee "${DIST}/logs/query-kernel-6.12-targets.raw" || true

            echo
            echo "==== query //kernel_device_modules-6.12:* ===="
            ./tools/bazel query '//kernel_device_modules-6.12:*' | tee "${DIST}/logs/query-device-modules-targets.raw" || true

            echo
            echo "==== query all interesting ===="
            ./tools/bazel query '//...' 2>&1 \
              | tee "${DIST}/logs/query-all.raw" \
              | grep -Ei 'mgk|k612|mtk|device|module|dtb|dtbo|dist|mt6895|k6895|gki|aarch64|kernel_aarch64' \
              | sort || true
          } 2>&1 | tee "${DIST}/logs/query-bazel-targets.log"

      - name: Build GKI Image
        if: ${{ github.event.inputs.build_gki == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/gki" "${DIST}/logs"

          GKI_BUILT=0

          {
            echo "==== Refresh kernel-6.12 targets ===="
            ./tools/bazel query '//kernel-6.12:*' > "${DIST}/logs/gki-targets.raw" 2>&1 || true
            cat "${DIST}/logs/gki-targets.raw" || true

            echo
            echo "==== Build known GKI targets ===="

            for target in \
              "//kernel-6.12:kernel_aarch64_dist" \
              "//kernel-6.12:gki_aarch64_dist" \
              "//kernel-6.12:kernel_aarch64" \
              "//kernel-6.12:kernel_aarch64_download_or_build" \
              "//kernel-6.12:gki_aarch64" \
              "//kernel-6.12:kernel_images" \
              "//kernel-6.12:kernel"
            do
              echo
              echo "==== Checking ${target} ===="

              if grep -qx "${target}" "${DIST}/logs/gki-targets.raw"; then
                echo "FOUND ${target}"

                if echo "${target}" | grep -q "_dist$"; then
                  if ./tools/bazel run ${BAZEL_FLAGS} "${target}" -- --destdir="${DIST}/gki"; then
                    GKI_BUILT=1
                    break
                  fi
                else
                  if ./tools/bazel build ${BAZEL_FLAGS} "${target}"; then
                    GKI_BUILT=1
                    break
                  fi
                fi
              else
                echo "MISSING ${target}"
              fi
            done

            if [ "${GKI_BUILT}" != "1" ]; then
              echo
              echo "==== Try auto-selected GKI dist targets ===="

              grep -Ei '(^//kernel-6.12:.*(gki|kernel).*aarch64.*dist$|^//kernel-6.12:.*dist$)' \
                "${DIST}/logs/gki-targets.raw" \
                | sort -u > "${DIST}/logs/gki-auto-candidates.list" || true

              cat "${DIST}/logs/gki-auto-candidates.list" || true

              while read -r target; do
                [ -n "${target}" ] || continue

                echo
                echo "==== Auto trying ${target} ===="

                if echo "${target}" | grep -q "_dist$"; then
                  if ./tools/bazel run ${BAZEL_FLAGS} "${target}" -- --destdir="${DIST}/gki"; then
                    GKI_BUILT=1
                    break
                  fi
                else
                  if ./tools/bazel build ${BAZEL_FLAGS} "${target}"; then
                    GKI_BUILT=1
                    break
                  fi
                fi
              done < "${DIST}/logs/gki-auto-candidates.list"
            fi

            echo
            echo "GKI_BUILT=${GKI_BUILT}"

            echo
            echo "==== gki output files ===="
            find "${DIST}/gki" -maxdepth 5 -type f | sort || true

            echo
            echo "==== bazel-bin image files ===="
            BAZEL_BIN="$(./tools/bazel info bazel-bin 2>/dev/null || true)"
            if [ -n "${BAZEL_BIN}" ] && [ -d "${BAZEL_BIN}" ]; then
              find "${BAZEL_BIN}" -type f \( \
                -name "Image" -o \
                -name "Image.gz" -o \
                -name "Image.lz4" -o \
                -name "vmlinux" -o \
                -name "System.map" \
              \) -print | sort || true
            fi
          } 2>&1 | tee "${DIST}/logs/build-gki.log"

          echo "GKI_BUILT=${GKI_BUILT}" > "${DIST}/logs/build-gki-result.txt"

          if [ "${GKI_BUILT}" != "1" ] && [ "${{ github.event.inputs.strict_fail }}" = "true" ]; then
            exit 1
          fi

      - name: Build MTK/MGK device modules
        if: ${{ github.event.inputs.build_modules == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd "${WORKROOT}/kernel"
          mkdir -p "${DIST}/modules-bazel" "${DIST}/logs"

          MODULES_BUILT=0

          {
            echo "==== Refresh module targets ===="
            ./tools/bazel query '//kernel_device_modules-6.12:*' > "${DIST}/logs/module-targets.raw" 2>&1 || true
            cat "${DIST}/logs/module-targets.raw" || true

            echo
            echo "==== Build known module targets ===="

            for target in \
              "//kernel_device_modules-6.12:mgk_64_k612_dist" \
              "//kernel_device_modules-6.12:mgk_64_k612" \
              "//kernel_device_modules-6.12:kernel_device_modules_dist" \
              "//kernel_device_modules-6.12:kernel_device_modules" \
              "//kernel_device_modules-6.12:modules" \
              "//kernel_device_modules-6.12:dtbs" \
              "//kernel_device_modules-6.12:dtbo"
            do
              echo
              echo "==== Checking ${target} ===="

              if grep -qx "${target}" "${DIST}/logs/module-targets.raw"; then
                echo "FOUND ${target}"

                if echo "${target}" | grep -q "_dist$"; then
                  if ./tools/bazel run ${BAZEL_FLAGS} "${target}" -- --destdir="${DIST}/modules-bazel"; then
                    MODULES_BUILT=1
                    break
                  fi
                else
                  if ./tools/bazel build ${BAZEL_FLAGS} "${target}"; then
                    MODULES_BUILT=1
                    break
                  fi
                fi
              else
                echo "MISSING ${target}"
              fi
            done

            if [ "${MODULES_BUILT}" != "1" ]; then
              echo
              echo "==== Try auto-selected module dist targets ===="

              grep -Ei '(^//kernel_device_modules-6.12:.*(mgk|k612|module|dtb|dtbo).*dist$|^//kernel_device_modules-6.12:.*dist$)' \
                "${DIST}/logs/module-targets.raw" \
                | sort -u > "${DIST}/logs/module-auto-candidates.list" || true

              cat "${DIST}/logs/module-auto-candidates.list" || true

              while read -r target; do
                [ -n "${target}" ] || continue

                echo
                echo "==== Auto trying ${target} ===="

                if echo "${target}" | grep -q "_dist$"; then
                  if ./tools/bazel run ${BAZEL_FLAGS} "${target}" -- --destdir="${DIST}/modules-bazel"; then
                    MODULES_BUILT=1
                    break
                  fi
                else
                  if ./tools/bazel build ${BAZEL_FLAGS} "${target}"; then
                    MODULES_BUILT=1
                    break
                  fi
                fi
              done < "${DIST}/logs/module-auto-candidates.list"
            fi

            echo
            echo "MODULES_BUILT=${MODULES_BUILT}"

            echo
            echo "==== module output files ===="
            find "${DIST}/modules-bazel" -maxdepth 8 -type f | sort || true

            echo
            echo "==== bazel-bin module files ===="
            BAZEL_BIN="$(./tools/bazel info bazel-bin 2>/dev/null || true)"
            if [ -n "${BAZEL_BIN}" ] && [ -d "${BAZEL_BIN}" ]; then
              find "${BAZEL_BIN}" -type f \( \
                -name "*.ko" -o \
                -name "*.dtb" -o \
                -name "*.dtbo" -o \
                -name "modules.order" -o \
                -name "Module.symvers" -o \
                -name "*.symvers" \
              \) -print | sort || true
            fi
          } 2>&1 | tee "${DIST}/logs/build-modules.log"

          echo "MODULES_BUILT=${MODULES_BUILT}" > "${DIST}/logs/build-modules-result.txt"

          if [ "${MODULES_BUILT}" != "1" ] && [ "${{ github.event.inputs.strict_fail }}" = "true" ]; then
            exit 1
          fi

      - name: Collect module metadata
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${DIST}/logs" "${DIST}/module-metadata"

          {
            echo "==== All built .ko files ===="
            find "${DIST}" -type f -name "*.ko" | sort || true

            echo
            echo "==== Module metadata ===="
            while read -r ko; do
              [ -f "$ko" ] || continue
              echo
              echo "---- ${ko} ----"
              modinfo "$ko" 2>/dev/null | grep -E "^(filename|name|vermagic|depends|intree|signer|parm):" || true
            done < <(find "${DIST}" -type f -name "*.ko" | sort)
          } 2>&1 | tee "${DIST}/logs/built-module-metadata.log"

          while read -r ko; do
            [ -f "$ko" ] || continue
            cp -av "$ko" "${DIST}/module-metadata/" || true
          done < <(find "${DIST}" -type f -name "*.ko" | sort)

      - name: Collect outputs
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${DIST}/final"

          find "${DIST}" -type f \( \
            -name "Image" -o \
            -name "Image.gz" -o \
            -name "Image.lz4" -o \
            -name "Image.lz4-dtb" -o \
            -name "vmlinux" -o \
            -name "System.map" -o \
            -name "*.ko" -o \
            -name "*.img" -o \
            -name "*.dtb" -o \
            -name "*.dtbo" -o \
            -name "modules.order" -o \
            -name "modules.builtin" -o \
            -name "modules.builtin.modinfo" -o \
            -name "Module.symvers" -o \
            -name "abi_symbollist" -o \
            -name "*.symvers" \
          \) -print | sort | tee "${DIST}/logs/final-interesting-files.log" || true

          while read -r f; do
            [ -f "$f" ] || continue
            cp -av "$f" "${DIST}/final/" || true
          done < "${DIST}/logs/final-interesting-files.log"

          echo "==== final files ===="
          find "${DIST}/final" -maxdepth 2 -type f | sort || true

          echo "==== logs ===="
          find "${DIST}/logs" -maxdepth 1 -type f | sort || true

          tar -C "${DIST}" -czf "${{ github.workspace }}/reno12-6.12-build-final.tar.gz" \
            final logs module-metadata \
            2>/dev/null || true

          if [ "${{ github.event.inputs.upload_full_dist }}" = "true" ]; then
            tar -C "${DIST}" -czf "${{ github.workspace }}/reno12-6.12-build-full-dist.tar.gz" . || true
          fi

          ls -lh "${{ github.workspace }}"/*.tar.gz || true

      - name: Upload final artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reno12-6.12-build-final
          path: reno12-6.12-build-final.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload full dist
        if: ${{ always() && github.event.inputs.upload_full_dist == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: reno12-6.12-build-full-dist
          path: reno12-6.12-build-full-dist.tar.gz
          if-no-files-found: warn
          retention-days: 7